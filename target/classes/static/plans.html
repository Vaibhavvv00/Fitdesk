<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitDesk - Plans</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="toast-container"></div>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <i class="fa-solid fa-dumbbell"></i> FitDesk
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="members.html"><i class="fa-solid fa-users"></i> Members</a></li>
                <li><a href="attendance.html"><i class="fa-solid fa-clipboard-check"></i> Attendance</a></li>
                <li><a href="trainers.html"><i class="fa-solid fa-user-ninja"></i> Trainers</a></li>
                <li><a href="plans.html" class="active"><i class="fa-solid fa-tags"></i> Plans</a></li>
                <li><a href="payments.html"><i class="fa-solid fa-credit-card"></i> Payments</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="btn btn-outline" style="width: 100%;" onclick="window.logout()">
                    <i class="fa-solid fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="header-actions">
                <h2>Membership Plans</h2>
                <button class="btn btn-primary" onclick="openPlanModal()">
                    <i class="fa-solid fa-plus"></i> Add Plan
                </button>
            </div>

            <div class="plan-grid" id="plansGrid">
                <!-- Populated by JS -->
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="planModalOverlay">
        <div class="modal" id="planModal">
            <div class="modal-header">
                <h3 id="modalTitle">Add Plan</h3>
                <button class="btn-close" onclick="closePlanModal()"><i class="fa-solid fa-times"></i></button>
            </div>
            <form id="planForm">
                <div class="modal-body">
                    <input type="hidden" id="planId">
                    <div class="form-group">
                        <label class="form-label">Plan Name</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                    <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div>
                            <label class="form-label">Duration (Months)</label>
                            <input type="number" id="durationMonths" class="form-control" required>
                        </div>
                        <div>
                            <label class="form-label">Price (₹)</label>
                            <input type="number" id="price" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea id="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="isActive" checked style="width: 16px; height: 16px;">
                        <label class="form-label" style="margin-bottom: 0;">Is Active</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closePlanModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Plan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/plans.js"></script>
</body>
</html>
