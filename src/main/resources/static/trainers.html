<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitDesk - Trainers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="toast-container"></div>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <i class="fa-solid fa-dumbbell"></i> FitDesk
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="members.html"><i class="fa-solid fa-users"></i> Members</a></li>
                <li><a href="attendance.html"><i class="fa-solid fa-clipboard-check"></i> Attendance</a></li>
                <li><a href="trainers.html" class="active"><i class="fa-solid fa-user-ninja"></i> Trainers</a></li>
                <li><a href="plans.html"><i class="fa-solid fa-tags"></i> Plans</a></li>
                <li><a href="payments.html"><i class="fa-solid fa-credit-card"></i> Payments</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="btn btn-outline" style="width: 100%;" onclick="window.logout()">
                    <i class="fa-solid fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="header-actions">
                <h2>Trainers</h2>
                <div style="display: flex; gap: 15px;">
                    <div class="search-bar">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="trainerSearch" class="form-control" placeholder="Search trainers...">
                    </div>
                    <button class="btn btn-primary" onclick="openTrainerModal()">
                        <i class="fa-solid fa-plus"></i> Add Trainer
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="table-container">
                    <table id="trainersTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Specialization</th>
                                <th>Salary</th>
                                <th>Join Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="trainerModalOverlay">
        <div class="modal" id="trainerModal">
            <div class="modal-header">
                <h3 id="modalTitle">Add Trainer</h3>
                <button class="btn-close" onclick="closeTrainerModal()"><i class="fa-solid fa-times"></i></button>
            </div>
            <form id="trainerForm">
                <div class="modal-body">
                    <input type="hidden" id="trainerId">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="fullName" class="form-control" required>
                    </div>
                    <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div>
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <div>
                            <label class="form-label">Phone</label>
                            <input type="text" id="phone" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Specialization</label>
                        <input type="text" id="specialization" class="form-control" required>
                    </div>
                    <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div>
                            <label class="form-label">Salary (₹)</label>
                            <input type="number" id="salary" class="form-control" required>
                        </div>
                        <div>
                            <label class="form-label">Join Date</label>
                            <input type="date" id="joinDate" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group" id="statusGroup" style="display: none;">
                        <label class="form-label">Status</label>
                        <select id="status" class="form-select">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeTrainerModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Trainer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/trainers.js"></script>
</body>
</html>
