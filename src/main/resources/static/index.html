<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitDesk - Login</title>
    <meta name="description" content="FitDesk Gym Management System Login">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div id="toast-container"></div>
    <div class="card login-card" id="loginCard">
        <div class="brand login-logo">
            <i class="fa-solid fa-dumbbell"></i> FitDesk
        </div>
        <p class="login-subtitle">Gym & Fitness Studio Management</p>
        
        <div id="loginError">Invalid email or password.</div>
        
        <form id="loginForm">
            <div class="form-group">
                <input type="email" class="form-control" id="loginEmail" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                Login to Dashboard
            </button>
        </form>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
