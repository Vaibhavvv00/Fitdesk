<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitDesk - Payments</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="toast-container"></div>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <i class="fa-solid fa-dumbbell"></i> FitDesk
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="members.html"><i class="fa-solid fa-users"></i> Members</a></li>
                <li><a href="attendance.html"><i class="fa-solid fa-clipboard-check"></i> Attendance</a></li>
                <li><a href="trainers.html"><i class="fa-solid fa-user-ninja"></i> Trainers</a></li>
                <li><a href="plans.html"><i class="fa-solid fa-tags"></i> Plans</a></li>
                <li><a href="payments.html" class="active"><i class="fa-solid fa-credit-card"></i> Payments</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="btn btn-outline" style="width: 100%;" onclick="window.logout()">
                    <i class="fa-solid fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="header-actions">
                <h2>Payments</h2>
                <button class="btn btn-primary" onclick="openPaymentModal()">
                    <i class="fa-solid fa-plus"></i> Record Payment
                </button>
            </div>

            <div class="card filter-bar">
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">Member</label>
                    <select id="filterMemberId" class="form-select"></select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">From</label>
                    <input type="date" id="filterFromDate" class="form-control">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">To</label>
                    <input type="date" id="filterToDate" class="form-control">
                </div>
                <div class="filter-bar-actions">
                    <button type="button" class="btn btn-outline" onclick="clearFilters()">Clear</button>
                    <button type="button" class="btn btn-primary" onclick="exportPaymentsCsv()">
                        <i class="fa-solid fa-file-csv"></i> Export CSV
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="table-container">
                    <table id="paymentsTable">
                        <thead>
                            <tr>
                                <th>Member Name</th>
                                <th>Amount</th>
                                <th>Date</th>
                                <th>Method</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="paymentModalOverlay">
        <div class="modal" id="paymentModal">
            <div class="modal-header">
                <h3 id="paymentModalTitle">Record Payment</h3>
                <button class="btn-close" onclick="closePaymentModal()"><i class="fa-solid fa-times"></i></button>
            </div>
            <form id="paymentForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Member</label>
                        <select id="memberId" class="form-select" required></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" id="amount" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Payment Method</label>
                        <select id="paymentMethod" class="form-select" required>
                            <option value="CASH">Cash</option>
                            <option value="CARD">Card</option>
                            <option value="UPI">UPI</option>
                            <option value="ONLINE">Online</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Payment Date</label>
                        <input type="date" id="paymentDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select id="status" class="form-select" required>
                            <option value="COMPLETED">Completed</option>
                            <option value="PENDING">Pending</option>
                            <option value="FAILED">Failed</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closePaymentModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Payment</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/payments.js"></script>
</body>
</html>
